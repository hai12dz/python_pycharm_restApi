<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý sản phẩm</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        /* Form styles */
        .form-container {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }

        textarea {
            height: 80px;
        }

        .btn {
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-primary {
            background-color: #4CAF50;
            color: white;
        }

        .btn-reset {
            background-color: #f44336;
            color: white;
            margin-left: 10px;
        }

        /* Table styles */
        .table-container {
            background-color: white;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #f2f2f2;
            font-weight: bold;
        }

        tr:hover {
            background-color: #f5f5f5;
        }

        .action-btn {
            padding: 6px 10px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            margin-right: 5px;
        }

        .edit-btn {
            background-color: #2196F3;
            color: white;
        }

        .delete-btn {
            background-color: #f44336;
            color: white;
        }

        .notification {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
            display: none;
        }

        .success {
            background-color: #dff0d8;
            color: #3c763d;
            border: 1px solid #d6e9c6;
        }

        .error {
            background-color: #f2dede;
            color: #a94442;
            border: 1px solid #ebccd1;
        }

        .loading {
            text-align: center;
            padding: 20px;
            font-style: italic;
            color: #666;
        }

        .search-container {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: flex-end;
        }

        .search-group {
            flex: 1;
            min-width: 200px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-secondary {
            background-color: #607d8b;
            color: white;
        }

        .btn-export {
            background-color: #ff9800;
            color: white;
        }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 0.8em;
            font-weight: bold;
        }

        .badge-success {
            background-color: #4CAF50;
            color: white;
        }

        .badge-warning {
            background-color: #ff9800;
            color: white;
        }

        .badge-danger {
            background-color: #f44336;
            color: white;
        }

        @media screen and (max-width: 768px) {

            table,
            thead,
            tbody,
            th,
            td,
            tr {
                display: block;
            }

            thead tr {
                position: absolute;
                top: -9999px;
                left: -9999px;
            }

            tr {
                margin-bottom: 15px;
                border: 1px solid #ddd;
            }

            td {
                border: none;
                position: relative;
                padding-left: 50%;
                text-align: right;
            }

            td:before {
                position: absolute;
                top: 12px;
                left: 12px;
                width: 45%;
                padding-right: 10px;
                white-space: nowrap;
                text-align: left;
                font-weight: bold;
                content: attr(data-label);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Quản lý sản phẩm</h1>

        <div id="notification" class="notification"></div>

        <!-- Search form -->
        <div class="search-container">
            <div class="search-group">
                <label for="searchName">Tên sản phẩm:</label>
                <input type="text" id="searchName" placeholder="Nhập tên sản phẩm...">
            </div>
            <div class="search-group">
                <label for="searchMaterial">Chất liệu:</label>
                <input type="text" id="searchMaterial" placeholder="Nhập tên chất liệu...">
            </div>
            <div>
                <button id="searchButton" class="btn btn-primary">Tìm kiếm</button>
                <button id="resetSearchButton" class="btn btn-reset">Xóa bộ lọc</button>
            </div>
        </div>

        <!-- Form for adding/editing products -->
        <div class="form-container">
            <h2 id="formTitle">Thêm sản phẩm mới</h2>
            <form id="productForm">
                <input type="hidden" id="productId">

                <div class="form-group">
                    <label for="tenSP">Tên sản phẩm:</label>
                    <input type="text" id="tenSP" required>
                </div>

                <div class="form-group">
                    <label for="chatLieu">Chất liệu:</label>
                    <select id="chatLieu" required>
                        <option value="">-- Chọn chất liệu --</option>
                        <!-- Options will be populated by JavaScript -->
                    </select>
                </div>

                <div class="form-group">
                    <label for="moTa">Mô tả:</label>
                    <textarea id="moTa"></textarea>
                </div>

                <div class="form-group">
                    <label for="giaNhap">Giá nhập:</label>
                    <input type="number" id="giaNhap" min="0" required>
                </div>

                <div class="form-group">
                    <label for="giaBan">Giá bán:</label>
                    <input type="number" id="giaBan" min="0" required>
                </div>

                <div class="form-group">
                    <label for="soLuong">Số lượng:</label>
                    <input type="number" id="soLuong" min="0" required>
                </div>

                <div>
                    <button type="submit" class="btn btn-primary">Lưu</button>
                    <button type="button" id="resetButton" class="btn btn-reset">Hủy</button>
                </div>
            </form>
        </div>

        <!-- Button group for inventory actions -->
        <div class="button-group">
            <button id="showAllButton" class="btn btn-secondary">Hiển thị tất cả sản phẩm</button>
            <button id="showInventoryButton" class="btn btn-secondary">Chỉ hiển thị hàng tồn kho</button>
            <button id="exportInventoryButton" class="btn btn-export">Xuất danh sách hàng tồn kho</button>
        </div>

        <!-- Table for displaying products -->
        <div class="table-container">
            <h2>Danh sách sản phẩm</h2>
            <div id="loading" class="loading">Đang tải dữ liệu...</div>
            <table id="productsTable" style="display: none;">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Tên sản phẩm</th>
                        <th>Chất liệu</th>
                        <th>Mô tả</th>
                        <th>Giá nhập</th>
                        <th>Giá bán</th>
                        <th>Số lượng</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Rows will be populated by JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // API endpoints
            const API_URL = 'http://localhost:5000/api';
            const PRODUCTS_API = `${API_URL}/products`;
            const MATERIALS_API = `${API_URL}/materials`;

            // DOM elements
            const productForm = document.getElementById('productForm');
            const productIdField = document.getElementById('productId');
            const formTitle = document.getElementById('formTitle');
            const resetButton = document.getElementById('resetButton');
            const notification = document.getElementById('notification');
            const productsTable = document.getElementById('productsTable');
            const loadingIndicator = document.getElementById('loading');
            const chatLieuSelect = document.getElementById('chatLieu');

            // Search elements
            const searchName = document.getElementById('searchName');
            const searchMaterial = document.getElementById('searchMaterial');
            const searchButton = document.getElementById('searchButton');
            const resetSearchButton = document.getElementById('resetSearchButton');

            // Inventory buttons
            const showAllButton = document.getElementById('showAllButton');
            const showInventoryButton = document.getElementById('showInventoryButton');
            const exportInventoryButton = document.getElementById('exportInventoryButton');

            // Track if we're in edit mode
            let isEditMode = false;

            // Load materials for the dropdown
            function loadMaterials() {
                fetch(MATERIALS_API)
                    .then(response => response.json())
                    .then(result => {
                        if (result.success) {
                            const materials = result.data;
                            materials.forEach(material => {
                                const option = document.createElement('option');
                                option.value = material.MaCL;
                                option.textContent = material.TenCL;
                                chatLieuSelect.appendChild(option);
                            });
                        } else {
                            showNotification(result.error, false);
                        }
                    })
                    .catch(error => {
                        console.error('Error loading materials:', error);
                        showNotification('Không thể tải danh sách chất liệu', false);
                    });
            }

            // Load all products and display them in the table
            function loadProducts() {
                loadingIndicator.style.display = 'block';
                productsTable.style.display = 'none';

                fetch(PRODUCTS_API)
                    .then(response => response.json())
                    .then(result => {
                        loadingIndicator.style.display = 'none';

                        if (result.success) {
                            displayProducts(result.data);
                        } else {
                            showNotification(result.error, false);
                        }
                    })
                    .catch(error => {
                        loadingIndicator.style.display = 'none';
                        console.error('Error loading products:', error);
                        showNotification('Không thể tải danh sách sản phẩm', false);
                    });
            }

            // Display products in the table
            function displayProducts(products) {
                const tableBody = productsTable.querySelector('tbody');
                tableBody.innerHTML = '';

                if (products.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="8" style="text-align: center;">Không tìm thấy sản phẩm nào</td></tr>';
                    productsTable.style.display = 'table';
                    return;
                }

                products.forEach(product => {
                    const row = document.createElement('tr');
                    const stockStatus = getStockStatus(product.SoLuong);

                    row.innerHTML = `
                        <td data-label="ID">${product.MaSP}</td>
                        <td data-label="Tên sản phẩm">${product.TenSP}</td>
                        <td data-label="Chất liệu">${product.ChatLieu}</td>
                        <td data-label="Mô tả">${product.MoTa || ''}</td>
                        <td data-label="Giá nhập">${formatCurrency(product.GiaNhap)}</td>
                        <td data-label="Giá bán">${formatCurrency(product.GiaBan)}</td>
                        <td data-label="Số lượng">
                            ${product.SoLuong}
                            <span class="badge ${stockStatus.class}">${stockStatus.text}</span>
                        </td>
                        <td data-label="Thao tác">
                            <button class="action-btn edit-btn" data-id="${product.MaSP}">Sửa</button>
                            <button class="action-btn delete-btn" data-id="${product.MaSP}">Xóa</button>
                        </td>
                    `;

                    tableBody.appendChild(row);
                });

                // Show the table
                productsTable.style.display = 'table';

                // Add event listeners to the buttons
                addButtonEventListeners();
            }

            // Get stock status badge
            function getStockStatus(quantity) {
                if (quantity <= 0) {
                    return { class: 'badge-danger', text: 'Hết hàng' };
                } else if (quantity <= 10) {
                    return { class: 'badge-warning', text: 'Sắp hết' };
                } else {
                    return { class: 'badge-success', text: 'Còn hàng' };
                }
            }

            // Add event listeners to edit and delete buttons
            function addButtonEventListeners() {
                // Edit buttons
                document.querySelectorAll('.edit-btn').forEach(button => {
                    button.addEventListener('click', function () {
                        const productId = this.getAttribute('data-id');
                        const row = this.closest('tr');

                        // Get values from the table row
                        const cells = row.querySelectorAll('td');

                        // Fill the form with product data
                        productIdField.value = productId;
                        document.getElementById('tenSP').value = cells[1].textContent;

                        // Find the material ID from the material name
                        const materialName = cells[2].textContent;
                        Array.from(chatLieuSelect.options).forEach(option => {
                            if (option.textContent === materialName) {
                                chatLieuSelect.value = option.value;
                            }
                        });

                        document.getElementById('moTa').value = cells[3].textContent;
                        document.getElementById('giaNhap').value = parseFloat(cells[4].textContent.replace(/[^\d.-]/g, ''));
                        document.getElementById('giaBan').value = parseFloat(cells[5].textContent.replace(/[^\d.-]/g, ''));

                        // Extract the quantity (remove the badge text)
                        const quantityText = cells[6].textContent.trim();
                        const quantity = parseInt(quantityText);
                        document.getElementById('soLuong').value = quantity;

                        // Change form to edit mode
                        formTitle.textContent = 'Chỉnh sửa sản phẩm';
                        isEditMode = true;

                        // Scroll to the form
                        document.querySelector('.form-container').scrollIntoView({ behavior: 'smooth' });
                    });
                });

                // Delete buttons
                document.querySelectorAll('.delete-btn').forEach(button => {
                    button.addEventListener('click', function () {
                        const productId = this.getAttribute('data-id');
                        const productName = this.closest('tr').cells[1].textContent;

                        if (confirm(`Bạn có chắc chắn muốn xóa sản phẩm "${productName}"?`)) {
                            deleteProduct(productId);
                        }
                    });
                });
            }

            // Handle form submission (create or update)
            productForm.addEventListener('submit', function (e) {
                e.preventDefault();

                const productData = {
                    TenSP: document.getElementById('tenSP').value,
                    ChatLieu: parseInt(document.getElementById('chatLieu').value),
                    MoTa: document.getElementById('moTa').value,
                    GiaNhap: parseFloat(document.getElementById('giaNhap').value),
                    GiaBan: parseFloat(document.getElementById('giaBan').value),
                    SoLuong: parseInt(document.getElementById('soLuong').value)
                };

                if (isEditMode) {
                    // Update existing product
                    updateProduct(productIdField.value, productData);
                } else {
                    // Create new product
                    createProduct(productData);
                }
            });

            // Search for products
            searchButton.addEventListener('click', function () {
                const tenSP = searchName.value.trim();
                const tenCL = searchMaterial.value.trim();

                loadingIndicator.style.display = 'block';
                productsTable.style.display = 'none';

                fetch(`${PRODUCTS_API}/search?ten_sp=${encodeURIComponent(tenSP)}&ten_cl=${encodeURIComponent(tenCL)}`)
                    .then(response => response.json())
                    .then(result => {
                        loadingIndicator.style.display = 'none';

                        if (result.success) {
                            displayProducts(result.data);
                            showNotification(`Tìm thấy ${result.count} sản phẩm`, true);
                        } else {
                            showNotification(result.error, false);
                        }
                    })
                    .catch(error => {
                        loadingIndicator.style.display = 'none';
                        console.error('Error searching products:', error);
                        showNotification('Không thể tìm kiếm sản phẩm', false);
                    });
            });

            // Reset search
            resetSearchButton.addEventListener('click', function () {
                searchName.value = '';
                searchMaterial.value = '';
                loadProducts();
            });

            // Show only inventory products
            showInventoryButton.addEventListener('click', function () {
                loadingIndicator.style.display = 'block';
                productsTable.style.display = 'none';

                fetch(`${PRODUCTS_API}/available`)
                    .then(response => response.json())
                    .then(result => {
                        loadingIndicator.style.display = 'none';

                        if (result.success) {
                            displayProducts(result.data);
                            showNotification(`Hiển thị ${result.count} sản phẩm tồn kho`, true);
                        } else {
                            showNotification(result.error, false);
                        }
                    })
                    .catch(error => {
                        loadingIndicator.style.display = 'none';
                        console.error('Error loading inventory:', error);
                        showNotification('Không thể tải danh sách tồn kho', false);
                    });
            });

            // Show all products
            showAllButton.addEventListener('click', function () {
                loadProducts();
            });

            // Export inventory to CSV
            exportInventoryButton.addEventListener('click', function () {
                fetch(`${PRODUCTS_API}/available`)
                    .then(response => response.json())
                    .then(result => {
                        if (result.success) {
                            exportToCSV(result.data, 'danh_sach_ton_kho.csv');
                            showNotification('Xuất danh sách tồn kho thành công', true);
                        } else {
                            showNotification(result.error, false);
                        }
                    })
                    .catch(error => {
                        console.error('Error exporting inventory:', error);
                        showNotification('Không thể xuất danh sách tồn kho', false);
                    });
            });

            // Export data to CSV file
            function exportToCSV(data, filename) {
                if (!data || !data.length) {
                    showNotification('Không có dữ liệu để xuất', false);
                    return;
                }

                // CSV headers
                const headers = [
                    'ID',
                    'Tên sản phẩm',
                    'Chất liệu',
                    'Mô tả',
                    'Giá nhập (VNĐ)',
                    'Giá bán (VNĐ)',
                    'Số lượng tồn'
                ];

                // Format data for CSV
                const rows = data.map(item => [
                    item.MaSP,
                    item.TenSP,
                    item.ChatLieu,
                    item.MoTa || '',
                    item.GiaNhap,
                    item.GiaBan,
                    item.SoLuong
                ]);

                // Combine headers and rows
                const csvContent = [
                    headers.join(','),
                    ...rows.map(row => row.map(cell =>
                        typeof cell === 'string' && (cell.includes(',') || cell.includes('"'))
                            ? `"${cell.replace(/"/g, '""')}"`
                            : cell
                    ).join(','))
                ].join('\n');

                // Create download link
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.setAttribute('href', url);
                link.setAttribute('download', filename);
                link.style.display = 'none';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }

            // Create a new product
            function createProduct(productData) {
                fetch(PRODUCTS_API, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(productData)
                })
                    .then(response => response.json())
                    .then(result => {
                        if (result.success) {
                            showNotification('Thêm sản phẩm thành công', true);
                            resetForm();
                            loadProducts();
                        } else {
                            showNotification(`Lỗi: ${result.error}`, false);
                        }
                    })
                    .catch(error => {
                        console.error('Error creating product:', error);
                        showNotification('Không thể thêm sản phẩm', false);
                    });
            }

            // Update an existing product
            function updateProduct(productId, productData) {
                fetch(`${PRODUCTS_API}/${productId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(productData)
                })
                    .then(response => response.json())
                    .then(result => {
                        if (result.success) {
                            showNotification('Cập nhật sản phẩm thành công', true);
                            resetForm();
                            loadProducts();
                        } else {
                            showNotification(`Lỗi: ${result.error}`, false);
                        }
                    })
                    .catch(error => {
                        console.error('Error updating product:', error);
                        showNotification('Không thể cập nhật sản phẩm', false);
                    });
            }

            // Delete a product
            function deleteProduct(productId) {
                fetch(`${PRODUCTS_API}/${productId}`, {
                    method: 'DELETE'
                })
                    .then(response => response.json())
                    .then(result => {
                        if (result.success) {
                            showNotification('Xóa sản phẩm thành công', true);
                            loadProducts();
                        } else {
                            showNotification(`Lỗi: ${result.error}`, false);
                        }
                    })
                    .catch(error => {
                        console.error('Error deleting product:', error);
                        showNotification('Không thể xóa sản phẩm', false);
                    });
            }

            // Reset the form
            function resetForm() {
                productForm.reset();
                productIdField.value = '';
                formTitle.textContent = 'Thêm sản phẩm mới';
                isEditMode = false;
            }

            // Reset button click handler
            resetButton.addEventListener('click', resetForm);

            // Show notification
            function showNotification(message, isSuccess) {
                notification.textContent = message;
                notification.className = 'notification';
                notification.classList.add(isSuccess ? 'success' : 'error');
                notification.style.display = 'block';

                // Hide after 5 seconds
                setTimeout(() => {
                    notification.style.display = 'none';
                }, 5000);
            }

            // Format currency
            function formatCurrency(amount) {
                return new Intl.NumberFormat('vi-VN', {
                    style: 'currency',
                    currency: 'VND'
                }).format(amount);
            }

            // Initialize
            loadMaterials();
            loadProducts();
        });
    </script>
</body>

</html>
